services:
  garment-prototype:
    image: golang:1.22-alpine
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    ports:
      - "8080:8080"
    environment:
      - ADDR=:8080
      - DATA_DIR=/workspace/backend/data
      - STATIC_DIR=/workspace/apps/web/dist
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: ["go", "run", "./cmd/api"]
