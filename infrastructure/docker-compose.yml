services:
  garment-prototype:
    build:
      context: ..
      dockerfile: Dockerfile
    image: garment-prototype:latest
    ports:
      - "8080:8080"
    environment:
      - ADDR=:8080
      - DATA_DIR=/app/data
      - STATIC_DIR=/app/web
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
